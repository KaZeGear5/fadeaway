name: Build FadeAway (.exe)

# Dépôt privé : GitHub fabrique seulement l'installeur Windows et le garde en "artefact".
# Tu le télécharges, puis tu le déposes dans le panneau admin de ton serveur
# (c'est le serveur qui distribue les mises à jour aux apps installées).
#
#   git tag v0.1.1
#   git push origin v0.1.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aligner la version du package sur le tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${{ github.ref_name }}" --no-git-tag-version --allow-same-version

      - run: npm install

      - name: Construire l'installeur
        run: npx electron-builder --win --publish never

      - name: Garder les fichiers de mise à jour
        uses: actions/upload-artifact@v4
        with:
          name: fadeaway-update
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
