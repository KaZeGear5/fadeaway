name: Admin (GitHub Pages)

# Publie le dossier admin/ : le panneau d'administration, hébergé par GitHub.
# La page ne contient aucun secret : elle parle à ton serveur avec ton mot de passe.
on:
  push:
    branches: [main]
    paths: ['admin/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin
      - id: deployment
        uses: actions/deploy-pages@v4
